apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://github.com/HuanNguyen09/minieyes.git
      targetRevision: 65589d0ae22a61c93e5289a1861b6b874cbdcab2
      path: charts/platform
      helm:
        valueFiles: [$values/clusters/cloud/values/platform.yaml]
    - repoURL: https://github.com/HuanNguyen09/minieyes-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=false]
