apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: event-api
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://github.com/HuanNguyen09/minieyes.git
      targetRevision: 63c05e3970ec5b5ae89b2befe7cb6d45dfd79d99
      path: charts/event-api
      helm:
        valueFiles: [$values/clusters/cloud/values/event-api.yaml]
    - repoURL: https://github.com/HuanNguyen09/minieyes-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: minieyes
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
